id = "jjuraszek.ntfy-notify"
name = "ntfy Notify"
version = "1.1.0"
description = "Push a notification to your phone via ntfy when a Herdr agent goes blocked or done."
author = "Jacek Juraszek"
min_herdr_version = "0.9.0"
platforms = ["linux", "macos"]

[[events]]
on = "pane.agent_status_changed"
command = ["/bin/sh", "run.sh", "notify.mjs"]

[[actions]]
id = "toggle"
title = "Toggle ntfy notifications for this tab"
command = ["/bin/sh", "run.sh", "toggle.mjs"]

[[actions]]
id = "enable"
title = "Arm ntfy notifications for this tab"
command = ["/bin/sh", "run.sh", "toggle.mjs", "on"]

[[actions]]
id = "disable"
title = "Disarm ntfy notifications for this tab"
command = ["/bin/sh", "run.sh", "toggle.mjs", "off"]
