name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 22]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check shared AGENTS core
        run: node scripts/check-agents-core.mjs
      - name: Syntax
        run: node --check notify.mjs && node --check lib.mjs && node --check toggle.mjs
      - name: Run tests
        run: node --test test/*.test.mjs
